name: CI

# Quality Gates 3, 4 y 7 de la constitución, ejecutados mecánicamente:
# la suite en verde, el linter sin excepciones silenciosas y el escaneo de
# dependencias sin vulnerabilidades críticas.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leagueflow
          POSTGRES_DB: leagueflow_test
          # Sin contraseña: base efímera del runner, accesible solo desde este
          # job. Evita una credencial literal en el repo (Principio VI).
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://leagueflow@localhost:5432/leagueflow_test
      ALLOWED_ORIGINS: http://localhost:5173
      COOKIE_SECURE: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Instalar dependencias
        run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - name: Lint (ruff)
        run: uv run ruff check src tests
      - name: Formato (ruff format --check)
        run: uv run ruff format --check src tests
      - name: Migraciones
        run: uv run alembic upgrade head
      - name: Tests unitarios y de contrato
        run: uv run pytest tests/unit tests/contract -v
      - name: Tests de integración
        run: uv run pytest tests/integration -v

  frontend:
    name: Frontend — lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Tests (Vitest)
        run: npm run test
      - name: Build
        run: npm run build

  dependencias:
    name: Escaneo de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Escaneo Python (pip-audit)
        working-directory: backend
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]" pip-audit
          # Las vulnerabilidades bloquean el merge: pip-audit sale con código
          # distinto de cero al encontrarlas (Quality Gate 7). --skip-editable
          # omite nuestro propio paquete, que no está en PyPI y no es auditable;
          # --strict no se usa porque convertiría esa omisión en un fallo.
          uv run pip-audit --skip-editable
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Escaneo Node (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=high
